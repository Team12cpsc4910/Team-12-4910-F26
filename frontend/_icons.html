{#- Shared line icons (24x24, drawn with the current text color).
    Usage: {% from '_icons.html' import icon %} ... {{ icon('cart') }}
    Icons are decorative: always pair them with visible text or an aria-label. -#}
{% macro icon(name, size=20) -%}
<svg class="icon" viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'home' %}
  <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M10 21v-6h4v6" />
{%- elif name == 'gift' %}
  <rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13" /><path d="M19 12v9H5v-9" />
  <path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5" />
{%- elif name == 'file' %}
  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" /><path d="M14 3v6h6" /><path d="M8 13h8M8 17h5" />
{%- elif name == 'cart' %}
  <circle cx="9" cy="20" r="1.5" /><circle cx="18" cy="20" r="1.5" />
  <path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.2" />
{%- elif name == 'user' %}
  <circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
{%- elif name == 'user-plus' %}
  <circle cx="10" cy="8" r="4" /><path d="M2 21c0-4 3.6-7 8-7s8 3 8 7" /><path d="M19 7v6M16 10h6" />
{%- elif name == 'users' %}
  <circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
  <path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18.5 14.3c1.8.8 3 2.9 3 5.7" />
{%- elif name == 'lock' %}
  <rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
{%- elif name == 'logout' %}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" />
{%- elif name == 'chevron-down' %}
  <path d="m6 9 6 6 6-6" />
{%- elif name == 'package' %}
  <path d="M21 8 12 3 3 8v8l9 5 9-5z" /><path d="m3 8 9 5 9-5" /><path d="M12 13v8" />
{%- elif name == 'building' %}
  <rect x="4" y="3" width="16" height="18" rx="1" /><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" />
  <path d="M10 21v-3h4v3" />
{%- elif name == 'chart' %}
  <path d="M3 21h18" /><path d="M6 17v-6M11 17V5M16 17v-9M21 17v-3" />
{%- elif name == 'list' %}
  <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
{%- elif name == 'coins' %}
  <circle cx="9" cy="9" r="6" /><path d="M18.1 10.4A6 6 0 1 1 10.4 18.1" /><path d="M7.5 7.5h2v4" />
{%- elif name == 'activity' %}
  <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
{%- elif name == 'arrow-right' %}
  <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
{%- elif name == 'badge-check' %}
  <circle cx="12" cy="12" r="9" /><path d="m8.5 12 2.5 2.5 4.5-5" />
{%- elif name == 'search' %}
  <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
{%- elif name == 'check' %}
  <path d="M5 12.5 9.5 17 19 7.5" />
{%- elif name == 'chevron-right' %}
  <path d="m9 6 6 6-6 6" />
{%- elif name == 'arrow-left' %}
  <path d="M19 12H5" /><path d="m11 18-6-6 6-6" />
{%- elif name == 'info' %}
  <circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 8h.01" />
{%- elif name == 'shield' %}
  <path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z" /><path d="m8.5 12 2.5 2.5 4.5-5" />
{%- endif %}
</svg>
{%- endmacro %}
