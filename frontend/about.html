<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About - Good Driver Incentive Program</title>
  <link rel="stylesheet" href="/style.css?v=5" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="https://main.d13wzj1s6istn6.amplifyapp.com/">Home</a>
      <a href="https://main.d13wzj1s6istn6.amplifyapp.com/about.html">About</a>
    </nav>
    <main>
      <h1>About</h1>
      <dl class="about-info">
        <dt>Product Name</dt>
        <dd id="product_name">Good Driver Incentive Program</dd>
        <dt>Product Description</dt>
        <dd id="product_description">Drivers can earn points and redeem sponsor rewards.</dd>
        <dt>Team #</dt>
        <dd id="team_number">12</dd>
        <dt>Version # (Sprint #)</dt>
        <dd id="version_number">Not available</dd>
        <dt>Release Date</dt>
        <dd id="release_date">Not available</dd>
      </dl>
      <p id="about-status" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script>
    // This page is deployed as static HTML on Amplify, so Jinja cannot run here.
    // Ask the Flask backend for AboutPage values; keep the fallback if unavailable.
    const apiOrigin = (window.location.hostname === 'main.d13wzj1s6istn6.amplifyapp.com')
      ? 'https://team12-backend-api.duckdns.org'
      : window.location.origin;
    fetch(`${apiOrigin}/api/about`)
      .then(response => {
        if (!response.ok) throw new Error('About request failed');
        return response.json();
      })
      .then(data => {
        for (const key of ['product_name', 'product_description', 'team_number',
                           'version_number', 'release_date']) {
          if (data[key] !== undefined && data[key] !== null) {
            document.getElementById(key).textContent = String(data[key]);
          }
        }
        if (!data.available) {
          document.getElementById('about-status').textContent =
            'Current sprint information is unavailable.';
        }
      })
      .catch(() => {
        document.getElementById('about-status').textContent =
          'Live About details are unavailable; showing basic project information.';
      });
  </script>
</body>
</html>
