<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Good Driver Incentive Program</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="container">
    <!-- Nav bar: these two links create the Home and About tabs -->
    <nav>
      <a href="/">Home</a>
      <a href="https://team12-backend-api.duckdns.org/about">About</a>
    </nav>

    <main>
      <h1>Good Driver Incentive Program</h1>
      <p style="text-align: center;">Welcome! Please log in to continue.</p>

     <form action="https://team12-backend-api.duckdns.org/login" method="POST" class="login-form">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit">Log In</button>
      </form>
    </main>
  </div>
</body>
</html>
