<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Sponsor User</title>
  <link rel="stylesheet" href="/style.css?v=5" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/admin/sponsor-users">Sponsor Users</a>
      <a href="/admin/accounts/new">Create User</a>
      <a href="/profile">My Profile</a>
      <a href="/logout">Log Out</a>
    </nav>
    <main>
      <h1>Edit {{ sponsor_user.first_name }} {{ sponsor_user.last_name }}</h1>

      {% if error %}
        <p class="error-message">{{ error }}</p>
      {% endif %}

      <form action="/admin/sponsor-users/{{ sponsor_user.sponsor_user_id }}/edit" method="POST" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name" maxlength="50" value="{{ values.first_name }}" required>
        </div>

        <div class="form-group">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name" maxlength="50" value="{{ values.last_name }}" required>
        </div>

        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" maxlength="50" value="{{ values.username }}" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" maxlength="100" value="{{ values.email }}" required>
        </div>

        <div class="form-group">
          <label for="sponsor_id">Company:</label>
          <select id="sponsor_id" name="sponsor_id" required>
            {% for sponsor in sponsors %}
              <option value="{{ sponsor.sponsor_id }}" {% if sponsor.sponsor_id | string == values.sponsor_id %}selected{% endif %}>
                {{ sponsor.sponsor_name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" name="account_locked" {% if values.account_locked %}checked{% endif %}>
            Account locked
          </label>
        </div>

        <button type="submit">Save Changes</button>
      </form>

      <p style="text-align: center;"><a href="/admin/sponsor-users/{{ sponsor_user.sponsor_user_id }}">Cancel</a></p>
    </main>
  </div>
</body>
</html>
