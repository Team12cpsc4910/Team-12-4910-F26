<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css?v=11">
</head>
<body class="app-body">

{% include '_app_header.html' %}

  <div class="container">
    <main>
      <h1>Change Password</h1>

      {% if error %}
        <p class="error-message">{{ error }}</p>
      {% endif %}

      <form action="/password" method="POST" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="current_password">Current Password:</label>
          <input type="password" id="current_password" name="current_password" required>
        </div>

        <div class="form-group">
          <label for="new_password">New Password:</label>
          <input type="password" id="new_password" name="new_password" required>

          <ul id="password-reqs" class="password-reqs">
            <li id="req-length" class="invalid">Minimum of 8 characters</li>
            <li id="req-upper" class="invalid">Contain 1 uppercase letter</li>
            <li id="req-number" class="invalid">Contain 1 number</li>
          </ul>
        </div>

        <script>
          const passwordInput = document.getElementById('new_password');
          const checks = {
            'req-length': val => val.length >= 8,
            'req-upper': val => /[A-Z]/.test(val),
            'req-number': val => /[0-9]/.test(val),
          };

          passwordInput.addEventListener('input', function() {
            for (const [id, passes] of Object.entries(checks)) {
              const item = document.getElementById(id);
              item.classList.toggle('valid', passes(passwordInput.value));
              item.classList.toggle('invalid', !passes(passwordInput.value));
            }
          });
        </script>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password:</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit">Change Password</button>
      </form>

      <p style="text-align: center;"><a href="/profile">Cancel</a></p>
    </main>
  </div>
</body>
</html>
