<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Change Password</title>
  <link rel="stylesheet" href="/style.css?v=5" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/admin/sponsor-users">Sponsor Users</a>
      <a href="/admin/admin-users">Admin Users</a>
      <a href="/admin/accounts/new">Create User</a>
      <a href="/profile">My Profile</a>
      <a href="/logout">Log Out</a>
    </nav>
    <main>
      <h1>Change Password</h1>

      {% if error %}
        <p class="error-message">{{ error }}</p>
      {% endif %}

      <form action="/admin/password" method="POST" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="current_password">Current Password:</label>
          <input type="password" id="current_password" name="current_password" required>
        </div>

        <div class="form-group">
          <label for="new_password">New Password:</label>
          <input type="password" id="new_password" name="new_password" required>

          <ul id="password-reqs" class="password-reqs">
            <li id="req-length" class="invalid">Minimum of 8 characters</li>
            <li id="req-upper" class="invalid">Contain 1 uppercase letter</li>
            <li id="req-number" class="invalid">Contain 1 number</li>
          </ul>
        </div>

        <script>
          const passwordInput = document.getElementById('new_password');
          const checks = {
            'req-length': val => val.length >= 8,
            'req-upper': val => /[A-Z]/.test(val),
            'req-number': val => /[0-9]/.test(val),
          };

          passwordInput.addEventListener('input', function() {
            for (const [id, passes] of Object.entries(checks)) {
              const item = document.getElementById(id);
              item.classList.toggle('valid', passes(passwordInput.value));
              item.classList.toggle('invalid', !passes(passwordInput.value));
            }
          });
        </script>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password:</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit">Change Password</button>
      </form>

      <p style="text-align: center;"><a href="/profile">Cancel</a></p>
    </main>
  </div>
</body>
</html>
